<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('site.title') }}{% endblock %}</title>
  <meta name="description" content="{{ t('site.tagline') }}">
  <meta name="color-scheme" content="light dark">
  <link rel="preload" href="/static/fonts/literata-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ asset('css/lafaz.css') }}">
  <script src="{{ asset('vendor/htmx-2.0.11.min.js') }}" defer></script>
  <script src="{{ asset('js/lafaz.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}page{% endblock %}">
  <a class="skip" href="#main">{{ t('site.skip') }}</a>
  <header class="top">
    <a class="wordmark" href="/">{{ t('site.title') }}</a>
    <span class="rung" title="{{ t('rung.title') }}">{{ t(rung_key) }}</span>
    <nav class="langs" aria-label="{{ t('lang.label') }}">
      {% for code in languages %}
      <a href="?lang={{ code }}" hreflang="{{ code }}" lang="{{ code }}"{% if code == lang %} aria-current="true"{% endif %}>{{ code | upper }}<span class="sr">, {{ t('lang.' ~ code) }}</span></a>
      {% endfor %}
    </nav>
  </header>
  <main id="main">{% block main %}{% endblock %}</main>
  <footer class="foot">
    <p>{{ t('footer.disclosure') }}</p>
  </footer>
</body>
</html>
